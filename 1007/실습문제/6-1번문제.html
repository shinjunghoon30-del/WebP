<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>1</title>
<script>
    function big(str1, str2) {
        if(parseInt(str1) > parseInt(str2)) {
            return str1;
        } else {
            return str2;
        }
    }
</script>
</head>
<body>
<script>
    let b = big("625", "555");
    document.write("큰수=" + b);
</script>
</body>
</html>
