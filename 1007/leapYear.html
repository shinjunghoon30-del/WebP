<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>윤년 판별</title>
</head>
<body>
  <h1>윤년 판별</h1>
  <label for="year">년도를 입력하세요:</label>
  <input type="number" id="year" min="1" step="1" placeholder="예: 2024">
  <button type="button" id="checkButton">판별</button>
  <p id="result" aria-live="polite"></p>

  <script>
    const yearField = document.getElementById('year');
    const result = document.getElementById('result');

    function checkLeapYear() {
      const year = Number(yearField.value);
      if (yearField.value.trim() === '' || !Number.isInteger(year) || year < 1) {
        result.textContent = '1 이상의 정수를 입력해 주세요.';
        return;
      }

      const leap = year % 400 === 0 || (year % 4 === 0 && year % 100 !== 0);
      result.textContent = `${year}년은 ${leap ? '윤년' : '평년'}입니다.`;
    }

    document.getElementById('checkButton').addEventListener('click', checkLeapYear);
    yearField.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') checkLeapYear();
    });
  </script>
</body>
</html>
