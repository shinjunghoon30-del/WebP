<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>이미지 커서 만들기</title>
    <style>
        #imgDiv {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none; 
        }
        #imgDiv img {
            width: 30px;
            height: 30px;
        }
    </style>
    <script>
        document.onmousemove = function(e) {
            let div = document.getElementById("imgDiv");
            div.style.left = e.clientX + "px";
            div.style.top = e.clientY + "px";
        };
    </script>
</head>
<body>
    <h3>이미지 커서 만들기</h3>
    <hr>
    <p>마우스를 움직이면 이미지로 만든 커서가 마우스를 따라 다닙니다.</p>
    <div id="imgDiv">
        <img src="image/spongebob.png" alt="커서">
    </div>
</body>
</html>
