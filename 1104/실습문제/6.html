<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>마우스 휠을 이용한 이미지 확대/축소</title>
    <script>
        function zoom(e, img) {
            e.preventDefault();
            let width = img.width;
            let height = img.height;
            if (e.deltaY < 0) {
                img.width = width * 0.95;
                img.height = height * 0.95;
            } else {
                img.width = width * 1.05;
                img.height = height * 1.05;
            }
        }
    </script>
</head>
<body>
    <h3>마우스 휠을 이용한 이미지 확대/축소</h3>
    <p>이미지 위에 휠을 위로 굴리면 이미지가 축소되고 아래로 굴리면 이미지가 확대됩니다.</p>
    <hr>
    <img src="image/spongebob.png" width="300" height="300" onwheel="zoom(event, this)">
</body>
</html>
