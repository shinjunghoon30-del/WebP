<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>계산기 만들기</title>
    <script>
        function calculate(e) {
            if (e.key === "Enter") {
                let exp = document.getElementById("exp").value;
                let res = document.getElementById("res");
                try {
                    res.value = eval(exp);
                } catch(err) {
                    alert("잘못된 수식입니다.");
                }
            }
        }
    </script>
</head>
<body>
    <h3>계산기 만들기</h3>
    <p>수식을 입력하고 &lt;Enter&gt;를 입력하세요.</p>
    <hr>
    <form>
        식 <input type="text" id="exp" onkeydown="calculate(event)"><br>
        값 <input type="text" id="res" readonly>
    </form>
</body>
</html>
