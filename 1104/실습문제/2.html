.html<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>라디오 버튼과 이미지 출력</title>
    <script>
        function changeImage() {
            let radios = document.getElementsByName("fruit");
            let img = document.getElementById("fruitImg");
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    img.src = radios[i].value;
                    break;
                }
            }
        }
    </script>
</head>
<body onload="changeImage()">
    <h3>라디오 버튼을 클릭하면 이미지를 출력합니다.</h3>
    <hr>
    <form>
        <input type="radio" name="fruit" value="image/banana.png" onclick="changeImage()">바나나
        <input type="radio" name="fruit" value="image/mango.png" onclick="changeImage()">망고
        <input type="radio" name="fruit" value="image/apple.png" checked onclick="changeImage()">사과
    </form>
    <br>
    <img id="fruitImg" src="image/apple.png" alt="과일 이미지">
</body>
</html>
