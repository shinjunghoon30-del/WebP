<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>마우스 클릭 연습</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            width: 40px;
            height: 40px;
            border: 1px solid gray;
            text-align: center;
            vertical-align: middle;
        }
        img {
            width: 35px;
            height: 35px;
        }
    </style>
    <script>
        function load() {
            let n = Math.floor(Math.random() * 100); 
            document.images[n].src = "image/donkey.png";
        }

        function move(obj) {
            obj.src = "";

            let n;
            while (true) {
                n = Math.floor(Math.random() * 100);
                if (document.images[n] !== obj) {
                    document.images[n].src = "image/donkey.png";
                    break;
                }
            }
        }
    </script>
</head>
<body onload="load()">
    <h3>마우스 클릭 연습</h3>
    <p>마우스 클릭을 연습하는 웹 페이지를 작성해보자. 10×10의 셀을 가진 표를 만들고 랜덤하게 선택한 셀에 이미지를 출력하라. 이미지를 클릭하면 다른 셀을 랜덤하게 선택하여 이미지를 출력한다.</p>
    <hr>

    <script>
        document.write("<table>");
        for (let i = 0; i < 10; i++) {
            document.write("<tr>");
            for (let j = 0; j < 10; j++) {
                document.write("<td><img onclick='move(this)'></td>");
            }
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>
</html>
