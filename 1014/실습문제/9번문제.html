<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>book 객체 만들기</title>
</head>
<body>
    <h3>book 객체 만들기</h3>
    <hr>
    <script>
        document.write("<b>(1) new Object() 이용</b><br>");
        let book1 = new Object();
        book1.title = "HTML5";
        book1.author = "황기태";
        book1.price = 20000;
        document.write("book : " + book1.title + ", " + book1.author + ", " + book1.price + "<br><br>");

        document.write("<b>(2) 리터럴 표기법 이용</b><br>");
        let book2 = {
            title: "HTML5",
            author: "황기태",
            price: 20000
        };
        document.write("book : " + book2.title + ", " + book2.author + ", " + book2.price + "<br><br>");

        document.write("<b>(3) 프로토타입 Book 이용</b><br>");
        function Book(title, author, price) {
            this.title = title;
            this.author = author;
            this.price = price;
        }
        let book3 = new Book("HTML5", "황기태", 20000);
        document.write("book : " + book3.title + ", " + book3.author + ", " + book3.price);
    </script>
</body>
</html>
