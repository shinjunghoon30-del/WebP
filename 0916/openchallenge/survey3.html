<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>설문지</title>
</head>
<body>
    <header>
        <h3>설문지</h3>
        <p>소프트웨어 기술에 대한 의견을 묻습니다. 많은 참여 부탁드립니다.</p>
        <hr>
    </header>

    <section>
        <form>
            <label>학년</label>
            <input type="radio" name="year" value="1"> 1학년
            <input type="radio" name="year" value="2"> 2학년
            <input type="radio" name="year" value="3"> 3학년
            <input type="radio" name="year" value="4"> 4학년
            <br><br>

            <label>성별</label>
            <input type="radio" name="gender" value="male"> 남
            <input type="radio" name="gender" value="female"> 여
            <br><br>

            <label>관심 분야</label>
            <select>
                <option value="mobile">모바일 소프트웨어</option>
                <option value="web">웹 기술</option>
                <option value="ai">인공지능</option>
            </select>
            <br><br>

            <label>진로</label>
            <input type="checkbox" name="job" value="dev"> 개발
            <input type="checkbox" name="job" value="plan"> 기획
            <input type="checkbox" name="job" value="sales"> 영업/마케팅
            <br><br>

            <label>남기고 싶은 말</label><br>
            <textarea cols="30" rows="5" placeholder="글을 남겨주세요"></textarea>
        </form>
    </section>
    <hr>

    <footer>
        <p>Copyright 2022 by Kitae</p>
    </footer>
</body>
</html>
