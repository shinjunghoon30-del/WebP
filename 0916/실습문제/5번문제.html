<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도형 서식 폼 만들기 - Chrome</title>
</head>
<body>
    <h3>도형 서식 폼 만들기</h3>
    <hr>
    <form>
        <fieldset>
            <legend>도형 서식 입력</legend>
            
            <p>
                <label for="line-type">선종류</label>
                <select id="line-type" name="line-type">
                    <option value="none">선없음</option>
                    <option value="solid" selected>실선</option>
                    <option value="dotted">점선</option>
                </select>
            </p>
            
            <p>
                <label for="line-width">선두께</label>
                <input type="number" id="line-width" name="line-width" min="1" max="10" value="1">
                
                <label for="line-color" style="margin-left: 20px;">선색</label>
                <input type="color" id="line-color" name="line-color" value="#0000ff">
            </p>
            
            <p>
                <label for="opacity">투명도(0~100):</label>
                <input type="range" id="opacity" name="opacity" min="0" max="100" value="50">
            </p>
        </fieldset>
    </form>
</body>
</html>
