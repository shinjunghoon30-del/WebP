<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>눈 내리는 마을</title>
    <style>
        body {
            background-image: url("media/snow.jpg");
            background-size: 100%;
            background-repeat: no-repeat;
            height: 100vh;
            overflow: hidden; 
            margin: 0;
            position: relative;
        }

        .snow {
            position: absolute;
            color: white;
            font-size: 15px;
            user-select: none;
            pointer-events: none; 
        }
    </style>
</head>
<body>

<script>
    const snowCount = 38;
    const snowflakes = []; 

    const windowWidth = window.innerWidth;
    const windowHeight = window.innerHeight;

    for (let i = 0; i < snowCount; i++) {
        let div = document.createElement("div");
        div.className = "snow";
        div.innerHTML = "*";

        let x = Math.random() * windowWidth;
        let y = Math.random() * windowHeight;

        let speed = Math.random() * 3 + 1; 

        div.style.left = x + "px";
        div.style.top = y + "px";

        document.body.appendChild(div);

        snowflakes.push({ element: div, x: x, y: y, speed: speed });
    }

    function fallSnow() {
        for (let i = 0; i < snowflakes.length; i++) {
            let flake = snowflakes[i];

            flake.y += flake.speed;

            if (flake.y > window.innerHeight) {
                flake.y = -20;
                flake.x = Math.random() * window.innerWidth;
                flake.element.style.left = flake.x + "px";
            }

            flake.element.style.top = flake.y + "px";
        }
    }

    setInterval(fallSnow, 30);
</script>

</body>
</html>
