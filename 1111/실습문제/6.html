<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>setInterval()/clearInterval()</title>
<style>
div {
    display: inline-block;
    width: 7em;
    border: 1px solid gray;
    background-color: aliceblue;
    cursor: pointer;
}
</style>
<script>
let timerID = null;

function startClock() {
    let clock = document.getElementById("clock");
    timeout(clock);
    timerID = setInterval("timeout(clock)", 1000);
}

function timeout(obj) {
    let current = new Date();
    obj.innerHTML = current.toLocaleTimeString();
}

function controlClock() {
    let clock = document.getElementById("clock");
    if (timerID !== null) {
        clearInterval(timerID);
        timerID = null;
        clock.style.color = "gray";
    } else {
        timeout(clock);
        timerID = setInterval("timeout(clock)", 1000);
        clock.style.color = "black";
    }
}
</script>
</head>
<body onload="startClock()">
<h3>div 태그에 시계 만들기</h3>
시계를 클릭하면 시계가 멈추고 다시 클릭하면 가기 시작한다.
<hr>
<div id="clock" onclick="controlClock()"></div>
</body>
</html>
