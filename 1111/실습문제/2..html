<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HTML5</title>
<script>
function welcome() {
    let win = window.open("", "", "left=500,top=400,width=200,height=80");
    win.document.write("접속 감사합니다!<br>열심히 하세요!");
    win.document.close();
    win.document.title = "환영";
    win.document.body.style.backgroundColor = "yellowgreen";
}
</script>
</head>
<body onload="welcome()">
<h3>HTML5</h3>
<hr>
<p>
HTML5를 학습하는 사이트입니다.
여기서 HTML5, CSS3, 자바스크립트를
배울 수 있습니다.</p>
</body>
</html>
