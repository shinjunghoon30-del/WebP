<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform:scale()</title>
<script>
let scaleVal = 1;
function expand(img) {
    scaleVal = (scaleVal % 4) + 1; 
    img.style.transform = "scale(" + scaleVal + ", 1)";
}
</script>
</head>
<body>
<h3>클릭하면 2,3,4배로 옆으로 늘어납니다.</h3>
<hr>
<img src="media/spongebob.png" onclick="expand(this)">
</body>
</html>
