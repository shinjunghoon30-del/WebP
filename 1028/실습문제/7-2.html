<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>transform:rotate()</title>
<script>
let angle = 0;
function rotate(img) {
    angle = (angle + 90) % 360;
    img.style.transform = "rotate(" + angle + "deg)";
}
</script>
</head>
<body>
<h3>클릭할 때마다 90도씩 회전합니다.</h3>
<hr>
<img src="media/spongebob.png" onclick="rotate(this)">
</body>
</html>
