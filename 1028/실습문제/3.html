<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>visibility 프로퍼티</title>
<script>
function toggleShow() {
    let spanList = document.getElementsByTagName("span");
    for (let i = 0; i < spanList.length; i++) {
        if (spanList[i].style.visibility == "hidden" || spanList[i].style.visibility == "") {
            spanList[i].style.visibility = "visible";
        } else {
            spanList[i].style.visibility = "hidden";
        }
    }
}
</script>
<style>
    span { visibility: hidden; }
</style>
</head>
<body>
<h3>다음 빈 곳에 숨은 단어? <button onclick="toggleShow()">show/hide</button></h3>
<hr>
<ul>
    <li>I (<span>love</span>) you.</li>
    <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
    <li>응답하라 (<span>1988</span>).</li>
</ul>
</body>
</html>
