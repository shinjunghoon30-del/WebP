<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>설문지</title>
    <link rel="stylesheet" type="text/css" href="survey5.css">
</head>
<body>
    <header>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 수집합니다. 많은 참여 부탁드립니다.</p>
    </header>

    <section>
        <form>
            <div class="row">
                <label class="label">학년</label>
                <div class="field">
                    <label><input type="radio" name="grade" value="1"> 1학년</label>
                    <label><input type="radio" name="grade" value="2"> 2학년</label>
                    <label><input type="radio" name="grade" value="3"> 3학년</label>
                </div>
            </div>

            <div class="row">
                <label class="label">성별</label>
                <div class="field">
                    <label><input type="radio" name="gender" value="m"> 남</label>
                    <label><input type="radio" name="gender" value="f"> 여</label>
                </div>
            </div>

            <div class="row">
                <label class="label">관심 분야</label>
                <div class="field">
                    <select name="interest">
                        <option value="mobile">모바일 소프트웨어</option>
                        <option value="web">웹 프로그래밍</option>
                        <option value="ai">인공지능</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <label class="label">진로</label>
                <div class="field">
                    <label><input type="radio" name="path" value="dev"> 개발</label>
                    <label><input type="radio" name="path" value="plan"> 기획</label>
                    <label><input type="radio" name="path" value="sales"> 영업</label>
                    <label><input type="radio" name="path" value="start"> 창업</label>
                </div>
            </div>


            <div class="row">
                <label class="label">남기고 싶은 말</label>
                <div class="field">
                    <textarea rows="4" cols="35" placeholder="글을 남겨주세요"></textarea>
                </div>
            </div>
        </form>
    </section>

    <footer>
        <p>Copyright 2022 by Kitae</p>
    </footer>
</body>
</html>
