<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>스폰지밥</title>
<style>
.container {
    position: relative;
}
.spongebob {
    position: absolute;
    top: 10px;
    left: 10px;
    border: 1px solid green;
    padding: 5px;
}
.text {
    margin-left: 130px; /* 이미지 너비+여백만큼 띄움 */
}
</style>
</head>
<body>
<h3>스폰지밥</h3>
<hr>
<div class="container">
    <img src="spongebob.png" class="spongebob" width="100">
    <div class="text">
        저는 스폰지밥입니다. 먹는 밥이 아니고요 제 이름이 그냥 그래요. 그리고 어린이부터 노인까지 많은 분들의 사랑을 받고 있어요. 제 친구 뚱이도 있고요. 징징이도 있고 집게 사장님도 있어요.
    </div>
</div>
</body>
</html>
