<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>어지러워요</title>
<style>
@keyframes rotate360 {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
img {
    animation: rotate360 1s infinite linear;
}
</style>
</head>
<body>
<h3>어지러워요</h3>
<hr>
<img src="spongebob.png" width="100">
</body>
</html>
