<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>어지러워요</title>
<style>
@keyframes rotateUpDown {
    0% { transform: rotate(-90deg); }
    50% { transform: rotate(90deg); }
    100% { transform: rotate(-90deg); }
}
img {
    animation: rotateUpDown 1s infinite linear;
}
</style>
</head>
<body>
<h3>어지러워요</h3>
<hr>
<img src="spongebob.png" width="100">
</body>
</html>
