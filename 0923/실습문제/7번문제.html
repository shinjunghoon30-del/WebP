<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>:hover 활용</title>
    <style>
        .card {
            width: 100px;
            height: 140px;
            background-image: url('card_back.png'); 
            background-size: cover;
        }
        .card:hover {
            background-image: url('card_front.png'); 
        }
    </style>
</head>
<body>
    <h3>:hover 활용</h3>
    <hr>
    <p>마우스를 올리면 카드의 앞면이 보인다.</p>
    <div class="card"></div>
</body>
</html>
