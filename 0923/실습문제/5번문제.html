<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>셀렉터</title>
  <style>
    body.main {
      background-color: #8daea3;
      text-align: center;
    }

    h3 {
      color: #3f6055;
    }

    #center {
      background-color: yellow; 
      display: inline-block;     
      padding: 3px 10px;         
      margin-bottom: 10px;
    }

    #center strong {
      color: blue; 
    }

    .indent {
      text-indent: 1.5em;
    }

    p em {
      color: green;
      font-style: normal;
    }

   .indent strong {
      color: red;
    }
  </style>
</head>
<body class="main">
  <h3>얼굴</h3>
  <hr>
  <div id="center"><strong>박인희</strong></div>
  <div class="indent">
    <p><em>길</em>을 걸고 산들을 무엇하리</p>
    <strong>꽃</strong>이 내가 아니듯 내가
    <strong>꽃</strong>이 될 수 없는 지금...
  </div>
</body>
</html>
