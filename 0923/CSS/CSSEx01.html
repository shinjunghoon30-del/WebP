<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>간단한 CSS 예제</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f2f2f2;
			text-align: center;
		}

		h1 {
			color: #2c3e50;
		}

		p {
			color: #555;
			font-size: 18px;
		}

		.button {
			display: inline-block;
			padding: 10px 20px;
			color: white;
			background-color: #3498db;
			text-decoration: none;
			border-radius: 5px;
		}

		.button:hover {
			background-color: #217dbb;
		}
	</style>
</head>
<body>
	<h1>CSS 예제</h1>
	<p>CSS로 글자와 버튼의 스타일을 꾸며 보았습니다.</p>
	<a class="button" href="#">클릭하기</a>
</body>
</html>
