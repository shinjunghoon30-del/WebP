<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설문 조사</title>
    <style>
        body {
            background-color: aliceblue;
            padding: 20px;
        }
        h1 {
            color: brown;
            text-align: center;
        }
        h2 {
            color: blue;
            text-shadow: 2px 2px 2px gray;
        }
    </style>
</head>
<body>
    <h1>설문지</h1>
    <p>소프트웨어 기술에 대한 의견을 수집합니다.</p>
    <hr>
    <form>
        <p><strong>1. 사용자 정보</strong></p>
        이름: <input type="text"><br><br>
        
        <p><strong>2. 이동통신사는?</strong></p>
        <input type="radio" name="telecom"> SKT
        <input type="radio" name="telecom"> KT
        <input type="radio" name="telecom"> LGT
        <input type="radio" name="telecom"> 기타<br><br>

        <p><strong>3. 남기고 싶은 말</strong></p>
        <textarea rows="5" cols="50" placeholder="글을 남겨주세요"></textarea>
    </form>
</body>
</html>
